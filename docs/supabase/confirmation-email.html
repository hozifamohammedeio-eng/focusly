<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:32px 16px;background:#f7f7f7;color:#17191c;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:520px;margin:0 auto;padding:32px;background:#ffffff;border:1px solid #e7e7e7;border-radius:20px">
    <p style="margin:0 0 24px;font-size:22px;font-weight:700">Focusly</p>
    <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3">Confirm your email</h1>
    <p style="margin:0 0 28px;font-size:16px;line-height:1.5">Confirm your email address to continue setting up your Focusly account.</p>
    <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:14px 22px;border-radius:999px;background:#17191c;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700">Confirm my Focusly account</a>
    <p style="margin:28px 0 8px;font-size:13px;line-height:1.5">If the button does not work, copy this link into your browser:</p>
    <p style="margin:0;overflow-wrap:anywhere;font-size:13px;line-height:1.5"><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email" style="color:#17191c">{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email</a></p>
  </div>
</body></html>
